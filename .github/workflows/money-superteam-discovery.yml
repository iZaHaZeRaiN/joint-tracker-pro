Il694qJR0ev2xDgSWE1Ko9wm+cFda8V7EuYmJcKV7nW5f5DIlvHl8ZbKmc9o
-----END CERTIFICATE-----
CERT

          AGENT_NAME="money-scout-${GITHUB_RUN_ID}"
          python3 - "$AGENT_NAME" > /tmp/register-body.json <<'PY'
import json, sys
print(json.dumps({"name": sys.argv[1]}))
PY

          curl -fsS -X POST "https://superteam.fun/api/agents" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/register-body.json \
            > "$REGISTER_FILE"

          API_KEY="$(python3 - "$REGISTER_FILE" <<'PY'
import json, sys
obj=json.load(open(sys.argv[1]))
def find_key(o):
    if isinstance(o, dict):
        if isinstance(o.get("apiKey"), str):
            return o["apiKey"]
        for v in o.values():
            r=find_key(v)
            if r: return r
    elif isinstance(o, list):
        for v in o:
            r=find_key(v)
            if r: return r
    return None
key=find_key(obj)
if not key:
    raise SystemExit("apiKey missing from registration response")
print(key)
PY
)"

          curl -fsS "https://superteam.fun/api/agents/listings/live?take=100&deadline=2026-12-31&type=bounty" \
            -H "Authorization: Bearer $API_KEY" \
            > "$LISTINGS_FILE"

          openssl cms -encrypt -aes256 -binary \
            -in "$LISTINGS_FILE" -outform DER -out "$ENC_FILE" "$CERT_FILE"

          echo "SUPERTEAM_LISTINGS_ENCRYPTED_BEGIN"
          base64 -w0 "$ENC_FILE"
          echo
          echo "SUPERTEAM_LISTINGS_ENCRYPTED_END"
