name: Money Scout - Superteam agent discovery

on:
  push:
    branches:
      - money-superteam-discovery

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Register ephemeral agent and fetch agent-eligible bounties
        shell: bash
        run: |
          set -euo pipefail
          CERT_FILE="$(mktemp)"
          REGISTER_FILE="$(mktemp)"
          LISTINGS_FILE="$(mktemp)"
          ENC_FILE="$(mktemp)"

          cat > "$CERT_FILE" <<'CERT'
-----BEGIN CERTIFICATE-----
MIIDKTCCAhGgAwIBAgIUfgGFAsyQrS0849tGBHoGhucMc6kwDQYJKoZIhvcNAQEL
BQAwJDEiMCAGA1UEAwwZc3VwZXJ0ZWFtLWFnZW50LWRpc2NvdmVyeTAeFw0yNjEw
